[project]
name = "mediscribe"
version = "1.0.0"
description = "Live medical transcription: mic capture, voice activity detection, parallel Groq Whisper STT and an AI clinical summary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    # ASGI server + WebSocket implementation (websockets, httptools, uvloop);
    # Vercel's Python runtime needs it installed to serve WebSocket connections.
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en-dashes / arrows in docstrings are intentional
